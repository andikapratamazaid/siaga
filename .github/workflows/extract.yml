name: Extract SIAGA archive
on:
  push:
    paths:
      - 'siaga-github.zip'
      - '.github/workflows/extract.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive and clean up
        run: |
          unzip -o siaga-github.zip
          rm -f siaga-github.zip
          topdir=$(find . -maxdepth 1 -mindepth 1 -type d ! -name .git ! -name .github -print | head -n 1)
          if [ -n "$topdir" ] && [ -z "$(find . -maxdepth 1 -type f -print -quit)" ]; then
            mv "$topdir"/* . 2>/dev/null || true
            mv "$topdir"/.[!.]* . 2>/dev/null || true
            rmdir "$topdir" 2>/dev/null || true
          fi
          rm -f .github/workflows/extract.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "andikapratamazaid"
          git config user.email "andikapratamazaid@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract SIAGA project files" || echo "Nothing to commit"
          git push
